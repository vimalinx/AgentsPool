<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">AgentsPool · Your agents. Your machines.</title>
  <desc id="desc">A shared compute pool for a trusted LAN. A control plane connects to machines with persistent workspaces.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#22353d" stroke-width="0.6"/></pattern>
  </defs>
  <rect width="1200" height="360" rx="16" fill="#101e25"/>
  <rect x="620" width="580" height="360" rx="16" fill="url(#grid)"/>
  <path d="M64 68h21m-21 8h14m-14 8h21" fill="none" stroke="#88e2c5" stroke-width="3" stroke-linecap="round"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="102" y="82" fill="#c2d2d8" font-size="15" letter-spacing="3">COMPUTE ON YOUR TERMS</text>
    <text x="62" y="162" fill="#f3f7f8" font-size="64" font-weight="700" letter-spacing="-2">AgentsPool</text>
    <text x="64" y="211" fill="#88e2c5" font-size="26">Your agents. Your machines.</text>
    <text x="64" y="248" fill="#b0c4cd" font-size="19">A shared compute pool for your LAN.</text>
    <text x="64" y="308" fill="#b0c4cd" font-size="13" letter-spacing="1.7">ONE BINARY</text>
    <circle cx="185" cy="303" r="2" fill="#5d7885"/>
