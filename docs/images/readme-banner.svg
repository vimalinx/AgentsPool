    <rect x="907" y="162" width="31" height="23" rx="3"/><path d="M903 193h39l-4-8h-31z"/>
    <rect x="907" y="260" width="31" height="31" rx="5"/><rect x="916" y="269" width="13" height="13" rx="2"/>
