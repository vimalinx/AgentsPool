    <path d="M788 180h46V82h54M834 180h54M834 180v98h54"/>
    <path d="M628 180h24" stroke-dasharray="4 5"/>
  </g>
  <circle cx="834" cy="180" r="5" fill="#88e2c5"/>
  <rect x="652" y="126" width="136" height="108" rx="12" fill="#1b343d" stroke="#4e7b79"/>
  <g stroke="#88e2c5" stroke-width="2" fill="none">
    <rect x="701" y="148" width="38" height="27" rx="4"/>
    <path d="M710 180h20M720 175v5M708 158h6m-6 7h24"/>
  </g>
  <text x="720" y="207" fill="#e4f4ef" font-family="Arial, Helvetica, sans-serif" font-size="14" text-anchor="middle">Control plane</text>
