      - machine_id
      - name
      - capabilities
      - resources
      properties:
        machine_id:
          type: string
        name:
          type: string
        capabilities:
          $ref: '#/components/schemas/NodeCapabilities'
        resources:
          $ref: '#/components/schemas/NodeResources'
    RegisterResponse:
