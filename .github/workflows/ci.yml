name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.0"
          cache: true
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.10"
      - name: Scan complete history for secrets
        run: |
          go run github.com/zricethezav/gitleaks/v8@v8.30.0 git . --redact --no-banner
          python3 scripts/check-public-history.py
      - name: Install real sandbox test dependencies
        run: sudo apt-get update && sudo apt-get install -y bubblewrap e2fsprogs util-linux age
      - name: Static checks and tests
        run: make check
      - name: Go vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - name: Race detector
        run: make race
      - name: Real control-plane/worker E2E
        run: make e2e
      - name: Real systemd sandbox and encrypted volume recovery E2E
        run: sudo python3 scripts/e2e-sandboxes.py dist/agentspool
      - name: Validate container packaging
        run: |
          ./scripts/init-compose.sh
          trap 'rm -f .env' EXIT
          docker compose config --quiet
          docker build -t agentspool:ci .
          docker run --rm agentspool:ci version
      - name: Reproducible release and standalone source archive
        env:
          AGENTSPOOL_VERIFY_DOCKER: "1"
        run: make release-verify
      - name: Binary archive installation, upgrade, rollback and uninstall
        run: sudo python3 scripts/e2e-install.py dist/release/*-linux-amd64.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: AgentsPool-release-candidates
          path: dist/release/
          if-no-files-found: error
          retention-days: 14
